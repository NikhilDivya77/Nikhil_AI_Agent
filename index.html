
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nikhil AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- CHAT AREA -->
    <main class="chat-area">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="profile">

                <div class="avatar">

                    <img
                        src="./WhatsApp Image 2026-09-01 at 11.12.56.jpeg"
                        alt="Nikhil Avatar"
                    >

                    <span class="online-dot"></span>

                </div>

                <div class="profile-info">

                    <h1>
                        Nikhil AI
                        <span class="verified">✓</span>
                    </h1>

                    <p>
                        <span></span>
                        Online
                    </p>

                </div>

            </div>

        </header>


        <!-- CHAT MESSAGES -->
        <section
            class="chat-messages"
            id="chatMessages"
        >

            <!-- WELCOME SCREEN -->

            <div class="welcome">

                <div class="welcome-avatar">

                    <img
                        src="./WhatsApp Image 2026-09-01 at 11.12.56.jpeg"
                        alt="Nikhil Avatar"
                    >

                </div>

                <p class="eyebrow">
                    PERSONAL AI
                </p>

                <h2>
                    Hey, I'm Nikhil AI 👋
                </h2>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-wrapper">

            <div class="input-box">

                <textarea
                    id="userInput"
                    rows="1"
                    placeholder="Message Nikhil AI..."
                ></textarea>

                <button
                    id="sendBtn"
                    class="send-btn"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="21"
                        height="21"
                    >

                        <path
                            d="M21.7 2.3a1 1 0 0 0-1.05-.23L2.65 9.1a1 1 0 0 0 .06 1.88l7.2 2.4 2.4 7.2a1 1 0 0 0 .92.68h.03a1 1 0 0 0 .93-.63l7.03-18a1 1 0 0 0-.52-1.33ZM4.9 10.08l13.45-5.25-7.8 7.8-5.65-1.88Zm8.22 8.22-1.88-5.65 7.8-7.8 5.92 13.45Z"
                        />

                    </svg>

                </button>

            </div>

            <p class="disclaimer">
                Nikhil AI can make mistakes. Check important information.
            </p>

        </div>

    </main>

</div>


<script
    type="module"
    src="script.js"
></script>

</body>

</html>
